name: Bluesky → Mastodon Crossposter

on:
  schedule:
    - cron: "*/10 * * * *"    # every 10 minutes
  workflow_dispatch:
    inputs:
      fetch_limit:
        description: "Fetch limit (1..100). If empty, uses repository variable or default."
        required: false
        default: ""

permissions:
  contents: read
  actions: write   # needed for actions/cache save

jobs:
  crosspost:
    runs-on: ubuntu-latest
    env:
      # Required (from Secrets)
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      MASTODON_BASE_URL: ${{ secrets.MASTODON_BASE_URL }}
      MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}

      # Optional (from dispatch input → repo vars → hardcoded fallback)
      FETCH_LIMIT: ${{ github.event.inputs.fetch_limit || vars.FETCH_LIMIT || '20' }}
      MASTODON_VISIBILITY: ${{ vars.MASTODON_VISIBILITY || 'public' }}
      MASTODON_MAX_CHARS: ${{ vars.MASTODON_MAX_CHARS || '500' }}

      # State file (kept in workspace; persisted via cache)
      STATE_FILE: sync_state.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Restore last known state (synced URIs) so we don't duplicate posts
      - name: Restore state cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.STATE_FILE }}
          key: bsky-masto-state-${{ runner.os }}-${{ github.ref_name }}-
          restore-keys: |
            bsky-masto-state-${{ runner.os }}-${{ github.ref_name }}-
            bsky-masto-state-${{ runner.os }}-
            bsky-masto-state-

      # Ensure the state file exists even on first run
      - name: Initialize state file if missing
        run: |
          test -f "${STATE_FILE}" || echo '{"synced_uris":[]}' > "${STATE_FILE}"

      - name: Run crossposter
        run: |
          python bsky_to_masto.py

      # Save updated state with key that changes when file content changes
      - name: Save state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.STATE_FILE }}
          key: bsky-masto-state-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles(env.STATE_FILE) }}

      - name: Summary
        if: always()
        run: |
          echo "Run complete on $(date -u '+%Y-%m-%d %H:%M:%SZ')." >> $GITHUB_STEP_SUMMARY
